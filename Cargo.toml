[package]
name = "intel8080_emu"
version = "0.1.0"
edition = "2021"
description = "Intel 8080 Emulator with Monitor ROM"
authors = ["Mike"]
default-run = "intel8080"

[dependencies]
crossterm = "0.27"
libc = "0.2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7"

[lib]
name = "intel8080_emu"
path = "src/lib.rs"

[[bin]]
name = "intel8080"
path = "src/main.rs"

[[bin]]
name = "pi8080d"
path = "src/pi_main.rs"
